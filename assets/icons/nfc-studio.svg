<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">NFC Studio</title>
  <desc>An orange NFC card with two cream tap waves.</desc>
  <!-- Veer Tools icon family: 1024 tile, 225 corner radius (22%), charcoal #17191d, 96-unit strokes -->
  <rect width="1024" height="1024" rx="225" fill="#17191d"/>
  <!-- the card (85.6 x 54 proportion) -->
  <rect x="138" y="592" width="372" height="236" rx="52" fill="#f69322"/>
  <!-- tap waves, centred on the card's top-right corner -->
  <g fill="none" stroke="#ffd9a1" stroke-width="96" stroke-linecap="round">
    <path d="M510 440A152 152 0 0 1 662 592"/>
    <path d="M510 264A328 328 0 0 1 838 592"/>
  </g>
</svg>
