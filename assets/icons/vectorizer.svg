<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">Vectorizer</title>
  <desc>A bold orange bezier curve between two cream square anchor nodes.</desc>
  <!-- Veer Tools icon family: 1024 tile, 225 corner radius (22%), charcoal #17191d, 96-unit strokes -->
